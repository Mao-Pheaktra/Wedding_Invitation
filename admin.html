<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Music Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f5f2;
            color: #26332d;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,.07);
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        p {
            color: #777;
            text-align: center;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #263b30;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 16px;
            font-size: 14px;
            text-align: center;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <div id="loginSection">
            <h2>Wedding Music Admin</h2>
            <p>Sign in to manage wedding music</p>

            <form id="loginForm">

                <label for="email">Admin Email</label>
                <input
                    type="email"
                    id="email"
                    required
                    placeholder="Enter your email"
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    required
                    placeholder="Enter your password"
                >

                <button type="submit" id="loginBtn">
                    Login
                </button>

            </form>
        </div>

        <div id="dashboardSection" class="hidden">

            <h2>Wedding Music Manager</h2>
            <p id="adminEmail"></p>

            <hr>

            <h3>Upload New Song</h3>

            <form id="uploadForm">

                <label for="songTitle">Song Name</label>
                <input
                    type="text"
                    id="songTitle"
                    placeholder="Enter song name"
                    required
                >

                <label for="songFile">Choose MP3 File</label>
                <input
                    type="file"
                    id="songFile"
                    accept=".mp3,audio/mpeg"
                    required
                >

                <button type="submit" id="uploadBtn">
                    Upload Song
                </button>

            </form>

            <hr>

            <h3>Your Music Library</h3>

            <div id="songList">
                Loading songs...
            </div>

            <button id="logoutBtn">Logout</button>

        </div>

        <div id="message"></div>

    </div>

    <script type="module" src="admin.js"></script>

</body>
</html>
